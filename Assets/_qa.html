<!doctype html><meta charset="utf-8">
<style>
  body{margin:0;background:#fff;font:13px -apple-system,"PingFang SC";color:#333}
  .row{display:flex;align-items:flex-end;gap:30px;padding:16px 26px}
  .c{text-align:center}.c img{display:block;margin:0 auto 6px;border-radius:22.4%}
  .l{font-size:11px;color:#8a8a8e}
  h4{margin:0;padding:7px 26px;font:600 12px -apple-system;color:#666;background:#f6f7f9}
  .dark{background:linear-gradient(180deg,#3c3c3e,#1b1b1d)}.dark .l{color:#c8c8cc}
  .dark h4{color:#c8c8cc;background:rgba(255,255,255,.07)}
  .zoom img{image-rendering:pixelated}
</style>
<h4>实际尺寸 · 浅色底</h4>
<div class="row">
  <div class="c"><img src="AppIcon.iconset/icon_16x16.png" width="16" height="16"><div class="l">16</div></div>
  <div class="c"><img src="AppIcon.iconset/icon_32x32.png" width="32" height="32"><div class="l">32</div></div>
  <div class="c"><img src="AppIcon.iconset/icon_32x32@2x.png" width="64" height="64"><div class="l">64</div></div>
  <div class="c"><img src="AppIcon.iconset/icon_128x128.png" width="128" height="128"><div class="l">128</div></div>
</div>
<div class="row dark">
  <div class="c"><img src="AppIcon.iconset/icon_16x16.png" width="16" height="16"><div class="l">16</div></div>
  <div class="c"><img src="AppIcon.iconset/icon_32x32.png" width="32" height="32"><div class="l">32</div></div>
  <div class="c"><img src="AppIcon.iconset/icon_32x32@2x.png" width="64" height="64"><div class="l">64</div></div>
  <div class="c"><img src="AppIcon.iconset/icon_128x128.png" width="128" height="128"><div class="l">128</div></div>
</div>

<div class="row zoom">
  <div class="c"><img src="AppIcon.iconset/icon_16x16.png" width="112" height="112"><div class="l">16</div></div>
  <div class="c"><img src="AppIcon.iconset/icon_32x32.png" width="160" height="160"><div class="l">32</div></div>
